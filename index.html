<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075E54">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Zap Organiza</title>
<style>
:root{--g:#25D366;--gd:#075E54;--bg:#ECE5DD;--ink:#111b21;--mut:#667781;--line:#e9edef}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg)}
header{position:sticky;top:0;z-index:10;background:var(--gd);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
header small{display:block;font-size:11px;opacity:.85}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:16px}
.cards{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card.dark{background:var(--gd);color:#fff}
.card label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.7;display:block}
.card b{font-size:20px;display:block;margin-top:4px}
.card small{font-size:11px;opacity:.7}
.add{margin:0 12px;background:#fff;border:2px dashed rgba(37,211,102,.5);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;width:calc(100% - 24px);text-align:left}
.add .ic{width:46px;height:46px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.add b{color:var(--gd);font-size:15px;display:block}.add span{font-size:12px;color:var(--mut)}
.quota{margin:8px 12px 0;font-size:11px;color:var(--mut);text-align:center}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 12px 4px}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:#54656f;font-weight:700;font-size:13px}
.tab.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.search{margin:10px 12px 0;background:#fff;border:1px solid var(--line);border-radius:99px;padding:10px 16px;display:flex;gap:8px}
.search input{border:0;outline:0;flex:1;font-size:14px;background:transparent}
.list{padding:12px;display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border-radius:18px 18px 4px 18px;padding:12px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:#d1f4cc;color:var(--gd);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;background-size:cover;background-position:center}
.mid{flex:1;min-width:0}.mid h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid p{font-size:12px;color:#54656f;margin-top:2px}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin:6px 6px 0 0;background:#e7f8ef;color:var(--gd)}
.tag.pend{background:#ffe9e9;color:#a33a3a}.tag.paid{background:#d1f4cc}.tag.bol{background:#fff3c4;color:#8a6d00}
.val{font-weight:800;font-size:16px;text-align:right}
.empty{text-align:center;padding:36px 12px;color:var(--mut);font-size:13px}
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:10}
.btn{flex:1;border:0;border-radius:99px;padding:13px;font-weight:700;font-size:14px;background:var(--g);color:#fff}
.btn.sec{background:#f0f2f5;color:var(--gd)}.btn.red{background:#ffe9e9;color:#a33a3a}
.btn:disabled{opacity:.6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{font-size:18px;margin-bottom:4px}.sheet .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
.f{display:block;margin-top:10px}.f span{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.f input,.f select{width:100%;margin-top:4px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.prev{width:100%;max-height:120px;object-fit:cover;border-radius:12px;margin-bottom:6px}
.prog{height:6px;background:#e9edef;border-radius:9px;overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;width:0;background:var(--g);transition:width .2s}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111b21;color:#fff;font-size:13px;padding:11px 16px;border-radius:99px;z-index:60;max-width:90%;text-align:center;display:none}
.ad{background:linear-gradient(135deg,#25D366,#075E54);color:#fff;border-radius:16px;padding:24px;text-align:center;margin:10px 0}
.ad b{font-size:18px;display:block}.ad p{font-size:12px;opacity:.9;margin-top:6px}
.hint{font-size:11px;color:var(--mut);margin-top:8px}
.clients{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cl{background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line)}.cl b{display:block;margin-top:6px;font-size:13px}.cl small{color:var(--mut);font-size:11px}.cl em{display:block;font-style:normal;font-weight:800;color:var(--gd);margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>ZAP ORGANIZA</h1><small>Seus comprovantes organizados</small></div>
  <div style="display:flex;gap:6px"><button class="ib" id="eye" title="Esconder valores">👁</button><button class="ib" id="menu" title="Mais">⋯</button></div>
</header>

<div class="cards">
  <div class="card dark" style="grid-column:span 2"><label>Recebi este mês</label><b id="tRec">—</b><small id="tRecN"></small></div>
  <div class="card"><label>Falta receber</label><b id="tPend">—</b><small id="tPendN"></small></div>
  <div class="card"><label>Total geral</label><b id="tAll">—</b><small id="tAllN"></small></div>
</div>

<button class="add" id="addBtn"><div class="ic">📎</div><div><b>Adicionar comprovante</b><span>Foto, print ou "Compartilhar" do WhatsApp</span></div></button>
<input type="file" id="file" accept="image/*" hidden>
<input type="file" id="bkFile" accept=".json,application/json" hidden>
<div class="quota" id="quota"></div>

<div class="tabs" id="tabs"></div>
<div class="search"><span>🔍</span><input id="q" placeholder="Buscar cliente… ex: Maria"></div>
<div class="list" id="list"></div>
</div>

<div class="bar">
  <button class="btn" id="shareApp">Compartilhar com outra autônoma</button>
  <button class="btn sec" id="manual" style="flex:0 0 52px" title="Lançar manualmente">＋</button>
</div>

<div class="modal" id="mSheet"><div class="sheet" id="sheet"></div></div>
<div class="modal" id="mAd"><div class="sheet" id="adBox"></div></div>
<div class="toast" id="toast"></div>

<script src="parser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
<script>
const $=s=>document.querySelector(s);
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const FREE_READS_PER_DAY=2, AD_SECONDS=5;
const S={items:[],tab:'Todos',q:'',hide:false};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Memória do aparelho cheia — exporte e limpe comprovantes antigos.')}};
S.items=load('zo_items',[]);S.hide=load('zo_hide',false);
const persist=()=>save('zo_items',S.items);

function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}
const money=n=>S.hide?'••••':brl(n);
function fmtDate(iso){const t=today();if(iso===t)return'Hoje';const y=new Date();y.setDate(y.getDate()-1);if(iso===ymd(y))return'Ontem';const[a,b,c]=iso.split('-');return`${c}/${b}`}
const close=id=>$(id).classList.remove('open');

/* ---------- cota diária / vídeo recompensado ---------- */
function quota(){const q=load('zo_quota',{day:'',used:0,bonus:0});if(q.day!==today())return{day:today(),used:0,bonus:0};return q}
function readsLeft(){const q=quota();return Math.max(0,FREE_READS_PER_DAY+q.bonus-q.used)}
function useRead(){const q=quota();q.used++;save('zo_quota',q);renderQuota()}
function renderQuota(){const n=readsLeft();$('#quota').textContent=n>0?`${n} leitura${n>1?'s':''} automática${n>1?'s':''} grátis hoje · depois, 1 vídeo curto libera mais`:'Leituras grátis de hoje acabaram · assista 1 vídeo para liberar mais 1'}
function showAd(){return new Promise(res=>{
  const box=$('#adBox');let s=AD_SECONDS;
  box.innerHTML=`<h2>Libere mais 1 leitura</h2><p class="sub">Anúncio de exemplo — troque pela sua rede de anúncios.</p><div class="ad"><b>Seu anúncio aqui</b><p>Patrocinador local</p></div><button class="btn sec" id="adWait" style="width:100%" disabled>Aguarde ${s}s…</button><button class="btn red" id="adCancel" style="width:100%;margin-top:8px">Cancelar</button>`;
  $('#mAd').classList.add('open');
  const iv=setInterval(()=>{s--;if(s>0){$('#adWait').textContent=`Aguarde ${s}s…`;return}clearInterval(iv);const b=$('#adWait');b.disabled=false;b.className='btn';b.textContent='✔ Liberar leitura';b.onclick=()=>{close('#mAd');const q=quota();q.bonus++;save('zo_quota',q);renderQuota();res(true)}},1000);
  $('#adCancel').onclick=()=>{clearInterval(iv);close('#mAd');res(false)};
})}

/* ---------- imagem + OCR ---------- */
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}
function drawScaled(img,max){const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
async function handleFile(file){
  if(!file)return;
  if(readsLeft()<=0){const ok=await showAd();if(!ok)return}
  const img=await loadImg(file).catch(()=>null);
  if(!img){toast('Não consegui abrir essa imagem.');return}
  const work=drawScaled(img,1800), thumb=drawScaled(img,96).toDataURL('image/jpeg',.6);
  openSheet(null,{thumb},true);
  const prog=$('#prog'),msg=$('#ocrMsg');
  let parsed={value:null,date:null,client:'',type:'Outro'};
  try{
    if(!window.Tesseract) throw new Error('Leitor ainda carregando (precisa de internet na 1ª vez).');
    const r=await Tesseract.recognize(work,'por',{logger:m=>{if(m.progress!=null&&prog)prog.style.width=Math.round(m.progress*100)+'%';if(msg&&m.status)msg.textContent=m.status.includes('recogn')?'Lendo o comprovante…':'Preparando leitor…'}});
    parsed=parseReceipt(r.data.text);useRead();
  }catch(e){toast(String(e.message||'Não consegui ler. Preencha manualmente.'),4000)}
  fillSheet(parsed,{thumb});
}

/* ---------- folha de edição ---------- */
function openSheet(item,extra={},loading=false){
  if(loading){
    $('#sheet').innerHTML=`<h2>Lendo comprovante…</h2><p class="sub" id="ocrMsg">Preparando leitor…</p>
    ${extra.thumb?`<img class="prev" src="${extra.thumb}">`:''}<div class="prog"><i id="prog"></i></div>
    <p class="hint">Na primeira vez baixa o leitor (alguns MB). Depois fica mais rápido.</p>`;
  } else fillSheet(item||{},extra,!!item);
  $('#mSheet').classList.add('open');
}
function fillSheet(d,extra={},editing=false){
  const type=d.type||'Outro';
  const status=d.status||(type==='Boleto'?'pending':'paid');
  const thumb=d.thumb||extra.thumb||'';
  $('#sheet').innerHTML=`
    <h2>${editing?'Editar':'Confira os dados'}</h2>
    <p class="sub">${!editing&&extra.thumb?'A leitura automática pode errar — corrija o que precisar.':'&nbsp;'}</p>
    ${thumb?`<img class="prev" src="${thumb}">`:''}
    <label class="f"><span>Cliente</span><input id="fC" value="${esc(d.client||'')}" placeholder="Nome de quem pagou"></label>
    <div class="row">
      <label class="f"><span>Valor (R$)</span><input id="fV" inputmode="decimal" value="${d.value!=null?String(d.value).replace('.',','):''}" placeholder="0,00"></label>
      <label class="f"><span>Data</span><input id="fD" type="date" value="${d.date||today()}"></label>
    </div>
    <div class="row">
      <label class="f"><span>Tipo</span><select id="fT">${['PIX','Boleto','Dinheiro','Outro'].map(o=>`<option ${o===type?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="f"><span>Situação</span><select id="fS"><option value="paid" ${status==='paid'?'selected':''}>Recebido</option><option value="pending" ${status==='pending'?'selected':''}>A receber</option></select></label>
    </div>
    <label class="f"><span>Serviço (opcional)</span><input id="fSv" value="${esc(d.service||'')}" placeholder="Ex: Escova + corte"></label>
    <label class="f"><span>WhatsApp da cliente (opcional)</span><input id="fP" inputmode="tel" value="${esc(d.phone||'')}" placeholder="11 99999-9999"></label>
    <div class="row" style="margin-top:16px">
      ${editing?'<button class="btn red" id="fDel" style="flex:0 0 90px">Excluir</button>':'<button class="btn sec" id="fCancel" style="flex:0 0 90px">Cancelar</button>'}
      <button class="btn" id="fSave">Salvar</button>
    </div>`;
  $('#fSave').onclick=()=>{
    const v=parseBRL($('#fV').value.replace(/[^\d.,]/g,'')||'');
    if(!(v>0)){toast('Informe um valor válido.');return}
    const rec={id:d.id||String(Date.now()),client:$('#fC').value.trim()||'Sem nome',value:v,date:$('#fD').value||today(),type:$('#fT').value,status:$('#fS').value,service:$('#fSv').value.trim(),phone:$('#fP').value.replace(/\D/g,''),thumb};
    const i=S.items.findIndex(x=>x.id===rec.id);
    if(i>=0)S.items[i]=rec;else S.items.unshift(rec);
    S.items.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    persist();close('#mSheet');render();toast('Salvo ✔');
  };
  if(editing)$('#fDel').onclick=()=>{if(confirm('Excluir este comprovante?')){S.items=S.items.filter(x=>x.id!==d.id);persist();close('#mSheet');render()}};
  else $('#fCancel').onclick=()=>close('#mSheet');
}

/* ---------- lista ---------- */
function chargeLink(it){
  const msg=`Oi ${it.client.split(' ')[0]}, tudo bem? Passando pra lembrar do pagamento de ${brl(it.value)}${it.service?` (${it.service})`:''}. Qualquer coisa me avisa! 😊`;
  const ph=it.phone?(it.phone.length<=11?'55'+it.phone:it.phone):'';
  return`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`;
}
const empty=()=>`<div class="empty">${S.items.length?'Nada encontrado.':'Nenhum comprovante ainda.<br>Toque em “Adicionar comprovante” para começar.'}</div>`;
function render(){
  const mo=today().slice(0,7);
  const rec=S.items.filter(i=>i.status==='paid'),pen=S.items.filter(i=>i.status!=='paid');
  const recM=rec.filter(i=>i.date.startsWith(mo));
  $('#tRec').textContent=money(recM.reduce((a,i)=>a+i.value,0));$('#tRecN').textContent=`${recM.length} recebido${recM.length===1?'':'s'}`;
  $('#tPend').textContent=money(pen.reduce((a,i)=>a+i.value,0));$('#tPendN').textContent=`${pen.length} em aberto`;
  $('#tAll').textContent=money(rec.reduce((a,i)=>a+i.value,0));$('#tAllN').textContent=`${rec.length} no total`;
  const tabs=[['Todos',S.items.length],['Recebidos',rec.length],['A receber',pen.length],['Clientes','']];
  $('#tabs').innerHTML=tabs.map(([n,c])=>`<button class="tab ${S.tab===n?'on':''}" data-t="${n}">${n}${c!==''?` (${c})`:''}</button>`).join('');
  const q=S.q.trim().toLowerCase();
  const L=$('#list');
  if(S.tab==='Clientes'){
    const g={};S.items.filter(i=>!q||i.client.toLowerCase().includes(q)).forEach(i=>{(g[i.client]??={sum:0,n:0,pend:0});if(i.status==='paid')g[i.client].sum+=i.value;else g[i.client].pend+=i.value;g[i.client].n++});
    const keys=Object.keys(g).sort((a,b)=>g[b].sum-g[a].sum);
    L.innerHTML=keys.length?`<div class="clients">${keys.map(k=>`<div class="cl" data-c="${esc(k)}"><div class="av" style="width:32px;height:32px;font-size:13px">${esc(k[0])}</div><b>${esc(k)}</b><small>${g[k].n} comprovante${g[k].n>1?'s':''}</small><em>${money(g[k].sum)}</em>${g[k].pend?`<small>deve ${money(g[k].pend)}</small>`:''}</div>`).join('')}</div>`:empty();
    return;
  }
  let arr=S.items;
  if(S.tab==='Recebidos')arr=rec;
  if(S.tab==='A receber')arr=pen;
  if(q)arr=arr.filter(i=>i.client.toLowerCase().includes(q));
  L.innerHTML=arr.length?arr.map(i=>`
    <div class="item" data-id="${esc(i.id)}">
      <div class="av" ${i.thumb?`style="background-image:url(${i.thumb})"`:''}>${i.thumb?'':esc((i.client||'?')[0])}</div>
      <div class="mid"><h3>${esc(i.client)}</h3><p>${esc(i.service||'—')} · ${fmtDate(i.date)}</p>
        <span class="tag ${i.type==='Boleto'?'bol':''}">${esc(i.type)}</span><span class="tag ${i.status==='paid'?'paid':'pend'}">${i.status==='paid'?'Recebido':'A receber'}</span></div>
      <div class="val">${money(i.value)}${i.status!=='paid'?`<br><a href="${chargeLink(i)}" target="_blank" rel="noopener" data-stop style="font-size:11px;color:var(--gd);font-weight:700">Cobrar 💬</a>`:''}</div>
    </div>`).join(''):empty();
}

/* ---------- eventos ---------- */
$('#addBtn').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];e.target.value='';handleFile(f)};
$('#manual').onclick=()=>openSheet(null,{},false);
$('#bkFile').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(data.app!=='zap-organiza'||!Array.isArray(data.items))throw 0;
    const ok=x=>x&&typeof x.id==='string'&&typeof x.value==='number'&&x.value>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||'');
    const have=new Set(S.items.map(i=>i.id));let added=0;
    for(const x of data.items){if(!ok(x)||have.has(x.id))continue;
      S.items.push({id:x.id,client:String(x.client||'Sem nome'),value:x.value,date:x.date,type:String(x.type||'Outro'),status:x.status==='pending'?'pending':'paid',service:String(x.service||''),phone:String(x.phone||'').replace(/\D/g,''),thumb:typeof x.thumb==='string'&&x.thumb.startsWith('data:image/')?x.thumb:''});added++}
    S.items.sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    persist();close('#mSheet');render();
    toast(added?`${added} comprovante${added>1?'s':''} restaurado${added>1?'s':''} ✔`:'Nada novo para restaurar (já estava tudo aqui).',3500);
  }catch{toast('Esse arquivo não é um backup do Zap Organiza.',3500)}
};
$('#q').oninput=e=>{S.q=e.target.value;render()};
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){S.tab=b.dataset.t;render()}};
$('#eye').onclick=()=>{S.hide=!S.hide;save('zo_hide',S.hide);render()};
$('#list').onclick=e=>{
  if(e.target.closest('[data-stop]'))return;
  const c=e.target.closest('[data-c]');if(c){S.q=c.dataset.c;$('#q').value=S.q;S.tab='Todos';render();return}
  const it=e.target.closest('[data-id]');if(it){const d=S.items.find(x=>x.id===it.dataset.id);if(d)openSheet(d,{},false)}
};
$('#mSheet').addEventListener('click',e=>{if(e.target.id==='mSheet')close('#mSheet')});
$('#shareApp').onclick=async()=>{
  const data={title:'Zap Organiza',text:'Tô usando o Zap Organiza pra organizar meus comprovantes de PIX. Acabou a bagunça! Olha:',url:location.href.split('?')[0]};
  if(navigator.share){try{await navigator.share(data)}catch{}}else window.open('https://wa.me/?text='+encodeURIComponent(data.text+' '+data.url),'_blank')
};
$('#menu').onclick=()=>{
  $('#sheet').innerHTML=`<h2>Mais opções</h2><p class="sub">Seus dados ficam só neste aparelho.</p>
    <button class="btn" id="oBk" style="width:100%">💾 Salvar backup (para outro aparelho)</button>
    <button class="btn sec" id="oRs" style="width:100%;margin-top:8px">📂 Restaurar backup</button>
    <p class="hint" style="margin:6px 0 12px">Salve o arquivo no Drive ou mande no seu WhatsApp. No outro aparelho, abra o app e toque em Restaurar.</p>
    <button class="btn sec" id="oCsv" style="width:100%">⬇ Exportar planilha (CSV)</button>
    <button class="btn sec" id="oSum" style="width:100%;margin-top:8px">📋 Copiar resumo do mês</button>
    <button class="btn red" id="oClr" style="width:100%;margin-top:8px">Apagar todos os dados</button>
    <button class="btn" id="oX" style="width:100%;margin-top:8px">Fechar</button>`;
  $('#mSheet').classList.add('open');
  $('#oX').onclick=()=>close('#mSheet');
  $('#oBk').onclick=async()=>{
    const payload=JSON.stringify({app:'zap-organiza',version:1,exportedAt:new Date().toISOString(),items:S.items});
    const name=`zap-organiza-backup-${today()}.json`;
    const file=new File([payload],name,{type:'application/json'});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Zap Organiza'});save('zo_lastBackup',today());close('#mSheet');return}}catch(e){if(e&&e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([payload],{type:'application/json'}));a.download=name;a.click();
    save('zo_lastBackup',today());close('#mSheet');toast('Backup salvo ✔');
  };
  $('#oRs').onclick=()=>$('#bkFile').click();
  $('#oCsv').onclick=()=>{const rows=[['Data','Cliente','Valor','Tipo','Situação','Serviço']].concat(S.items.map(i=>[i.date,i.client,String(i.value).replace('.',','),i.type,i.status==='paid'?'Recebido':'A receber',i.service]));
    const csv='﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='zap-organiza.csv';a.click();close('#mSheet')};
  $('#oSum').onclick=async()=>{const mo=today().slice(0,7);const r=S.items.filter(i=>i.status==='paid'&&i.date.startsWith(mo)).reduce((a,i)=>a+i.value,0),p=S.items.filter(i=>i.status!=='paid').reduce((a,i)=>a+i.value,0);
    const t=`Resumo do mês — Recebi ${brl(r)} · Falta receber ${brl(p)}`;try{await navigator.clipboard.writeText(t);toast('Copiado!')}catch{toast(t,5000)}close('#mSheet')};
  $('#oClr').onclick=()=>{if(confirm('Apagar TODOS os comprovantes deste aparelho?')){S.items=[];persist();close('#mSheet');render()}};
};

/* ---------- PWA: service worker + receber do "Compartilhar" ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  if(!location.search.includes('shared=1')||!('caches' in window))return;
  try{const c=await caches.open('zo-shared');const r=await c.match('shared-file');if(r){const b=await r.blob();await c.delete('shared-file');history.replaceState({},'',location.pathname);handleFile(new File([b],'comprovante',{type:b.type||'image/jpeg'}))}}catch{}
})();
renderQuota();render();
</script>
</body>
</html>
